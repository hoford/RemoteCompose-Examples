<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RemoteCompose Examples</title>
<link rel="stylesheet" href="assets/app.css">
<script src="assets/player.js"></script>
</head>
<body class="doc-body">
<div class="doc-page">
  <div class="stage">
    <div class="stage-bar">
      <a class="back" href="index.html">← all examples</a>
      <label class="size-pick">
        played at
        <select id="size">
          <option value="native">default</option>
          <option value="2x">2×</option>
          <option value="4x">4×</option>
          <option value="320">320 × 320</option>
          <option value="512">512 × 512</option>
          <option value="1024">1024 × 1024</option>
        </select>
        <span id="size-note"></span>
      </label>
    </div>
    <div class="frame"><div id="player"></div></div>
  </div>

  <div class="doc-info">
    <h2 id="title">loading…</h2>
    <div class="path" id="docid"></div>
    <p id="desc"></p>
    <div class="chips" id="tags"></div>
    <h3 class="sec">Authored from</h3>
    <div class="sources" id="downloads"></div>
    <table class="kv" id="kv"></table>
    <div class="ops" id="ops"></div>
  </div>
</div>
<script type="module" src="assets/doc.js"></script>
</body>
</html>
