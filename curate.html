<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curate — RemoteCompose Examples</title>
<link rel="stylesheet" href="assets/app.css">
<script src="assets/player.js"></script>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">RemoteCompose</span>
  </a>
  <nav class="topnav">
    <a href="index.html">Explore</a>
    <a href="ops.html">Operations</a>
    <a href="playground.html">Playground</a>
    <a href="AGENTS.md">For agents</a>
    <a class="on" href="curate.html">Curate</a>
  </nav>
  <div class="searchwrap">
    <input id="q" type="search" autocomplete="off" spellcheck="false"
           placeholder="Search documents…" aria-label="Search documents">
  </div>
  <div class="topright">
    <div class="segmented" role="group" aria-label="View">
      <button id="view-grid" class="on" title="Grid view" aria-pressed="true">▦</button>
      <button id="view-list" title="List view" aria-pressed="false">☰</button>
    </div>
    <div class="segmented" role="group" aria-label="Theme">
      <button id="theme-light" title="Light">☀</button>
      <button id="theme-dark" title="Dark">☾</button>
    </div>
  </div>
</header>

<div class="chiprow">
  <button id="filters-badge" class="filters-badge">
    <span>Filters</span><span class="badge" id="filters-count">0</span>
  </button>
  <div class="quickchips" id="quickchips"></div>
  <div class="cbar-right">
    <button id="only" class="quick">★ Featured only</button>
    <span class="pending" id="cstatus"></span>
    <button class="commit" id="commit" disabled>Commit “featured update”</button>
  </div>
</div>

<div id="cbanner" class="banner" hidden>
  Read-only. Curation edits need the local tool: <code>tools/curate.py</code>, then open
  <code>http://127.0.0.1:8900/curate.html</code>.
</div>

<div id="scrim"></div>

<main>
  <aside id="sidebar">
    <div class="side-head">
      <strong>Filters</strong>
      <span class="dim" id="side-active">none active</span>
      <button id="clear" hidden>Clear all</button>
      <button class="side-close" id="side-close" aria-label="Close filters">×</button>
    </div>
    <div id="facets"></div>
    <footer class="sidebar-foot">
      <a href="catalog/corpus.jsonl">corpus.jsonl</a> · <a href="README.md">about</a>
    </footer>
  </aside>

  <section class="results">
    <div class="results-head">
      <span id="count">loading…</span>
      <div class="active-pills" id="pills"></div>
      <label class="sortwrap">Sort by
        <select id="sort">
          <option value="added">Recently added</option>
          <option value="name">Name</option>
          <option value="size">Size</option>
          <option value="ops">Operations</option>
        </select>
      </label>
    </div>
    <div id="grid">
      <div class="plane"></div>
      <div id="spacer"></div>
    </div>
  </section>
</main>

<script type="module" src="assets/curate.js"></script>
</body>
</html>
