<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curate — RemoteCompose Examples</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/curate.css">
<script src="assets/player.js"></script>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">RemoteCompose</span>
  </a>
  <nav class="topnav">
    <a href="index.html">Explore</a>
    <a href="ops.html">Operations</a>
    <a href="playground.html">Playground</a>
    <a href="AGENTS.md">For agents</a>
    <a class="on" href="curate.html">Curate</a>
  </nav>
  <div class="topright">
    <div class="segmented" role="group" aria-label="Theme">
      <button id="theme-light" title="Light">☀</button>
      <button id="theme-dark" title="Dark">☾</button>
    </div>
  </div>
</header>

<div id="cbanner" class="banner" hidden>
  Read-only. Curation needs the local tool: <code>tools/curate.py</code>, then open
  <code>http://127.0.0.1:8900/curate.html</code>.
</div>

<main class="cur">

  <div class="cur-bar">
    <button id="prev" class="navbtn" title="Previous (←)">←</button>
    <button id="next" class="navbtn" title="Next (→)">→</button>
    <span class="cur-pos" id="pos">—</span>

    <label class="cur-filter">Show
      <select id="filter">
        <option value="all">all documents</option>
        <option value="untagged">untagged only</option>
        <option value="nodesc">no description</option>
        <option value="touched">edited this session</option>
      </select>
    </label>

    <input id="jump" type="search" autocomplete="off" spellcheck="false"
           placeholder="Jump to document…" aria-label="Jump to document">

    <span class="cur-spacer"></span>
    <span class="pending" id="cstatus"></span>
    <button class="commit" id="commit" disabled>Commit</button>
  </div>

  <div class="cur-body">

    <section class="cur-stage">
      <div id="player" class="cur-player"></div>
      <div class="cur-meta">
        <a id="openlink" href="#" target="_blank" rel="noopener">open ↗</a>
        <span id="dims" class="dim"></span>
      </div>
    </section>

    <section class="cur-panel">
      <h1 id="title">loading…</h1>
      <code id="docid" class="dim"></code>

      <label class="cur-label" for="desc">Description</label>
      <textarea id="desc" rows="5" spellcheck="true"
                placeholder="What does this document draw?"></textarea>

      <label class="cur-label">Tags
        <span class="dim" id="tagcount"></span>
      </label>
      <div id="tags" class="tagpalette"></div>

      <form id="newtagform" class="newtag" autocomplete="off">
        <input id="newtag" type="text" placeholder="new tag, then Enter"
               aria-label="Add a new tag" spellcheck="false">
        <button type="submit">Add</button>
      </form>

      <p class="cur-help dim">
        <kbd>←</kbd> <kbd>→</kbd> previous / next ·
        <kbd>1</kbd>…<kbd>9</kbd> toggle the first nine tags ·
        <kbd>⌘</kbd><kbd>↵</kbd> save and go next
      </p>
    </section>

  </div>
</main>

<script type="module" src="assets/curate.js"></script>
</body>
</html>
