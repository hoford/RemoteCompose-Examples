<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playground — RemoteCompose Examples</title>
<link rel="stylesheet" href="assets/app.css">
<script src="assets/player.js"></script>
<script src="assets/json2rc.js"></script>
</head>
<body class="pg-body">

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">RemoteCompose</span>
  </a>
  <nav class="topnav">
    <a href="index.html">Explore</a>
    <a href="ops.html">Operations</a>
    <a class="on" href="playground.html">Playground</a>
    <a href="AGENTS.md">For agents</a>
  </nav>
  <div class="searchwrap">
    <select id="example" class="pg-pick"><option value="">Load an example…</option></select>
  </div>
  <div class="topright">
    <div class="segmented" role="group" aria-label="Theme">
      <button id="theme-light" title="Light">☀</button>
      <button id="theme-dark" title="Dark">☾</button>
    </div>
  </div>
</header>

<div class="pg">
  <section class="pg-left">
    <div class="pg-bar">
      <span class="pg-title">document.json</span>
      <span id="document-status" class="pg-status"></span>
      <button id="fmt" class="stage-btn">Format</button>
      <button id="share" class="stage-btn" title="URL carrying this document">Copy link</button>
    </div>
    <textarea id="document-editor" spellcheck="false" autocomplete="off"></textarea>
    <pre id="validation-errors" class="pg-err" hidden></pre>
    <pre id="validation-warnings" class="pg-warn" hidden></pre>
  </section>

  <section class="pg-right">
    <div class="pg-bar">
      <span class="pg-title">preview</span>
      <span id="render-status" class="pg-status"></span>
      <button id="play" class="stage-btn">Pause</button>
      <div class="pg-dl">
        <button id="download-png" class="stage-btn">↓ PNG</button>
        <button id="download-rc" class="stage-btn">↓ .rc</button>
        <button id="download-json" class="stage-btn">↓ .json</button>
      </div>
    </div>
    <div class="frame" id="stage"><div id="player"></div></div>

    <!-- The machine-facing surface. Always present and always current, so automation never
         has to scrape the human UI; shown as a panel only in agent mode. -->
    <section id="agent-panel" class="agent-panel" hidden>
      <div class="agent-row">
        <span>status <b id="document-state">idle</b></span>
        <span>size <b><span id="document-width">–</span> × <span id="document-height">–</span></b></span>
        <span>operations <b id="operation-count">–</b></span>
      </div>
      <img id="preview-image" alt="rendered document">
      <pre id="agent-output">{}</pre>
    </section>
  </section>
</div>

<!-- Opened from file://, ES modules and fetch are both blocked, so the page below never
     runs and simply appears blank. Say so rather than failing silently. -->
<script>
if (location.protocol === 'file:') {
  document.body.innerHTML =
    '<div class="pg-file-note"><h2>Serve this over HTTP</h2>' +
    '<p>Opened straight from disk, the browser blocks ES modules and <code>fetch</code>, ' +
    'so nothing here can load.</p><pre>cd ' +
    '&lt;this folder&gt;\npython3 tools/rcx.py serve\n\n# then open\n' +
    'http://localhost:8000/playground.html</pre>' +
    '<p><code>python3 -m http.server 8000</code> works just as well, or use the published ' +
    'copy, which needs no server at all.</p></div>';
}
</script>
<script type="module" src="assets/playground.js"></script>
</body>
</html>
